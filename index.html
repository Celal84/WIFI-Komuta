<!doctype html>
<html lang="tr" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EX20v Ağ Kontrol Merkezi</title>
<meta name="description" content="TP-Link EX20v ev ağı için hız, bufferbloat, cihaz ve Wi-Fi kanal kontrol merkezi">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script>tailwind.config = { darkMode: 'class' };</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  :root { color-scheme: dark; }
  html, body { background: #0b1220; }
  body { padding-bottom: env(safe-area-inset-bottom); -webkit-tap-highlight-color: transparent; }
  .card { background: #111a2e; border: 1px solid #1e2a44; border-radius: 1rem; }
  .tab-btn[aria-selected="true"] { background: #2563eb; color: #fff; }
  .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { scrollbar-width: none; }
  .chip { font-size: .72rem; padding: .15rem .5rem; border-radius: 999px; white-space: nowrap; }
  input, select, textarea { background: #0b1220; border: 1px solid #2a3858; border-radius: .6rem; padding: .55rem .7rem; color: #e5e7eb; width: 100%; }
  input:focus, select:focus { outline: 2px solid #2563eb; outline-offset: 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; border-radius: .7rem; padding: .6rem 1rem; font-weight: 600; font-size: .9rem; transition: .15s; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: #2563eb; color: #fff; } .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
  .btn-ghost { background: #1a2540; color: #cbd5e1; } .btn-ghost:hover:not(:disabled) { background: #22304f; }
  .btn-danger { background: #7f1d1d; color: #fecaca; } .btn-danger:hover:not(:disabled) { background: #991b1b; }
  .path { font-family: ui-monospace, monospace; font-size: .78rem; background: #0b1220; border: 1px dashed #334155; border-radius: .5rem; padding: .35rem .55rem; display: inline-block; }
  .spin { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
  [data-lucide] { width: 1.1em; height: 1.1em; }
</style>

<body class="text-slate-200 antialiased min-h-screen">

<header class="sticky top-0 z-30 bg-[#0b1220]/95 backdrop-blur border-b border-[#1e2a44]">
  <div class="max-w-5xl mx-auto px-4 pt-3 pb-2">
    <div class="flex items-center justify-between gap-3">
      <div class="min-w-0">
        <h1 class="font-bold text-[15px] sm:text-lg leading-tight"><span id="app-title">EX20v Ağ Kontrol Merkezi</span> <span class="text-sky-300 font-semibold whitespace-nowrap" id="app-version"></span></h1>
        <p class="text-[11px] text-slate-500">TP-Link EX20v · AX1800 · 192.168.1.1</p>
      </div>
      <button id="mode-badge" class="chip bg-slate-700 text-slate-200 flex items-center gap-1 shrink-0" title="Mod bilgisi">
        <i data-lucide="loader" class="spin"></i> Kontrol ediliyor
      </button>
    </div>
    <nav class="mt-3 flex gap-1.5 overflow-x-auto no-scrollbar" role="tablist" id="tabs"></nav>
  </div>
</header>

<div id="alert-bar" class="hidden max-w-5xl mx-auto px-4 mt-3"></div>

<main class="max-w-5xl mx-auto px-4 py-4 space-y-4" id="view"></main>

<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 z-50 hidden px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-600 text-sm shadow-xl max-w-[90vw]"></div>

<div id="modal" class="fixed inset-0 z-40 hidden bg-black/70 flex items-end sm:items-center justify-center p-3">
  <div class="card w-full max-w-md p-5 max-h-[85vh] overflow-y-auto" id="modal-body"></div>
</div>

<script>
'use strict';
/* =====================================================================
   EX20v Ağ Kontrol Merkezi — tek dosya PWA (derleme yok)
   Sürüm: VERSION sabiti + VERSION dosyası + agent/server.py birlikte güncellenir.
   ===================================================================== */
const VERSION = '1.0.0';
const GATEWAY = '192.168.1.1';
const CF = 'https://speed.cloudflare.com';
const AGENT_PORT = 8080;

/* Modem menü yolları — firmware/dil farkı varsa yalnızca burayı düzelt. */
const MENU = {
  wireless: ['Gelişmiş (Advanced)', 'Kablosuz (Wireless)', 'Kablosuz Ayarları (Wireless Settings)'],
  smartConnect: ['Gelişmiş (Advanced)', 'Kablosuz (Wireless)', 'Kablosuz Ayarları', 'Akıllı Bağlantı (Smart Connect)'],
  dhcp: ['Gelişmiş (Advanced)', 'Ağ (Network)', 'LAN Ayarları (LAN Settings)', 'DHCP Sunucusu'],
  qos: ['Gelişmiş (Advanced)', 'QoS'],
  blacklist: ['Gelişmiş (Advanced)', 'Güvenlik (Security)', 'Erişim Kontrolü (Access Control)', 'Kara Liste (Blacklist)'],
  reboot: ['Gelişmiş (Advanced)', 'Sistem Araçları (System Tools)', 'Yeniden Başlat (Reboot)'],
  firmware: ['Gelişmiş (Advanced)', 'Sistem Araçları (System Tools)', 'Firmware Yükseltme'],
};
const CATEGORIES = ['Telefon', 'Bilgisayar', 'Tablet', 'TV / Medya', 'Oyun Konsolu', 'Akıllı Ev / IoT', 'Yazıcı', 'Modem / Ağ', 'Diğer'];

/* ------------------------------------------------------------- yardımcılar */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (v, d = 1) => v == null || isNaN(v) ? '—' : Number(v).toFixed(d);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const jitterOf = a => a.length < 2 ? 0 : a.slice(1).reduce((t, v, i) => t + Math.abs(v - a[i]), 0) / (a.length - 1);
const store = {
  get(k, d) { try { const v = localStorage.getItem('ex20v.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('ex20v.' + k, JSON.stringify(v)); } catch { /* özel mod */ } },
};
const icons = () => window.lucide && lucide.createIcons();
const pathHtml = arr => `<span class="path">${arr.map(esc).join(' <span class="text-slate-500">›</span> ')}</span>`;
const modemLink = `<a href="http://${GATEWAY}" target="_blank" rel="noopener" class="btn btn-ghost !py-1.5 !px-3 text-xs"><i data-lucide="external-link"></i> ${GATEWAY}</a>`;

function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), ms);
}
async function copy(text, label = 'Kopyalandı') {
  try {
    if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
    else {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    toast(`${label}: ${text}`);
  } catch { toast('Kopyalanamadı — elle seçip kopyalayın'); }
}
function modal(html) { $('#modal-body').innerHTML = html; $('#modal').classList.remove('hidden'); icons(); }
function closeModal() { $('#modal').classList.add('hidden'); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' || e.target.closest('[data-close]')) closeModal(); });

/* ------------------------------------------------------------- durum */
const S = {
  tab: store.get('tab', 'ozet'),
  agent: null,          // { base, info }
  last: store.get('last', null),
  devices: null, devicesLoading: false, devFilter: 'all',
  wifi: null, wifiLoading: false, wifiError: null,
  router: null, routerLoading: false, routerError: null,
  history: [], running: false, live: null,
  settings: Object.assign({ agentUrl: '', key: '', planDown: 0, planUp: 0, duration: 10 }, store.get('settings', {})),
  charts: {},
};
const saveSettings = () => store.set('settings', S.settings);

/* ------------------------------------------------------------- ajan algılama */
function agentCandidates() {
  const c = [];
  const servedByAgent = location.protocol === 'http:' && location.port === String(AGENT_PORT);
  if (servedByAgent) c.push(location.origin);
  if (S.settings.agentUrl) c.push(S.settings.agentUrl.replace(/\/+$/, ''));
  c.push(`http://localhost:${AGENT_PORT}`, `http://127.0.0.1:${AGENT_PORT}`);
  // HTTPS sayfadan yerel ağ IP'sine HTTP isteği tarayıcıca engellenir (mixed content); denemeye gerek yok.
  return [...new Set(c)].filter(u => location.protocol === 'http:' || u.startsWith('https:') || /\/\/(localhost|127\.0\.0\.1)/.test(u));
}
async function probe(base) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 1500);
  try {
    const opts = { signal: ctl.signal, cache: 'no-store' };
    if (/\/\/(localhost|127\.)/.test(base) && location.protocol === 'https:') opts.targetAddressSpace = 'loopback';
    const r = await fetch(base + '/api/health', opts);
    if (!r.ok) return null;
    const info = await r.json();
    return info && info.ok ? info : null;
  } catch { return null; } finally { clearTimeout(t); }
}
async function detectAgent() {
  for (const base of agentCandidates()) {
    const info = await probe(base);
    if (info) {
      S.agent = { base, info };
      if (!S.settings.key && !info.key_required) {
        try { const k = await (await fetch(base + '/api/key')).json(); if (k.key) { S.settings.key = k.key; saveSettings(); } } catch { }
      }
      break;
    }
  }
  renderBadge(); render();
  if (S.agent) loadHistory().then(() => S.tab === 'gecmis' && render());
}
async function api(path, opts = {}) {
  if (!S.agent) throw new Error('Ajan bağlı değil');
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (S.settings.key) headers['X-Agent-Key'] = S.settings.key;
  const r = await fetch(S.agent.base + path, Object.assign({}, opts, { headers }));
  let body = null; try { body = await r.json(); } catch { }
  if (!r.ok) { const e = new Error((body && (body.detail || body.error)) || `HTTP ${r.status}`); e.status = r.status; e.body = body; throw e; }
  return body;
}
function renderBadge() {
  const b = $('#mode-badge');
  if (S.agent) {
    b.className = 'chip bg-emerald-600/20 text-emerald-300 border border-emerald-500/40 flex items-center gap-1 shrink-0';
    b.innerHTML = '<i data-lucide="plug-zap"></i> Yerel Ajan Bağlı';
  } else {
    b.className = 'chip bg-sky-600/20 text-sky-300 border border-sky-500/40 flex items-center gap-1 shrink-0';
    b.innerHTML = '<i data-lucide="cloud"></i> Bulut/Tarayıcı Modu';
  }
  b.onclick = () => modal(S.agent
    ? `<h3 class="font-bold mb-2">Yerel Ajan Bağlı</h3><p class="text-sm text-slate-300">Adres: <b>${esc(S.agent.base)}</b><br>Bilgisayar: ${esc(S.agent.info.hostname)} (${esc(S.agent.info.pc_ip)})<br>Ajan sürümü: v${esc(S.agent.info.version)}</p>
       <p class="text-sm text-slate-400 mt-3">Telefondan açmak için: <b>http://${esc(S.agent.info.pc_ip)}:${AGENT_PORT}</b></p>
       <button class="btn btn-ghost w-full mt-4" data-close>Kapat</button>`
    : `<h3 class="font-bold mb-2">Bulut/Tarayıcı Modu</h3><p class="text-sm text-slate-300">Hız/Bufferbloat testi, ağ doktoru, QoS hesaplayıcı ve geçmiş (bu tarayıcıda) çalışır.</p>
       ${agentHelp()}<button class="btn btn-ghost w-full mt-4" data-close>Kapat</button>`);
  icons();
}
function agentHelp() {
  return `<div class="text-sm text-slate-300 mt-3 space-y-2">
    <p><b>Tam kontrol için</b> Windows bilgisayarda repodaki <code class="text-sky-300">baslat.bat</code> dosyasını çalıştırın.</p>
    <p>• Aynı bilgisayardan: bu sayfa ajanı otomatik bulur (Chrome "yerel ağ erişimi" izni sorarsa <b>İzin ver</b>).</p>
    <p>• Telefondan: <code class="text-sky-300">http://&lt;PC-IP&gt;:${AGENT_PORT}</code> adresini açın (baslat.bat penceresinde yazar). GitHub Pages (HTTPS) sayfası, güvenlik kuralı gereği yerel ağdaki HTTP ajana bağlanamaz.</p>
  </div>`;
}

/* ------------------------------------------------------------- sekmeler */
const TABS = [
  ['ozet', 'Özet', 'layout-dashboard'], ['hiz', 'Hız Testi', 'gauge'], ['doktor', 'Ağ Doktoru', 'stethoscope'],
  ['cihazlar', 'Cihazlar', 'smartphone'], ['wifi', 'Wi-Fi Kanal', 'radio-tower'], ['modem', 'Modem', 'router'],
  ['gecmis', 'Geçmiş', 'line-chart'], ['ayarlar', 'Ayarlar', 'settings'],
];
function renderTabs() {
  $('#tabs').innerHTML = TABS.map(([id, label, ic]) =>
    `<button class="tab-btn btn btn-ghost !py-1.5 !px-3 text-[13px] shrink-0" role="tab" aria-selected="${S.tab === id}" data-tab="${id}"><i data-lucide="${ic}"></i>${label}</button>`).join('');
}
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  go(b.dataset.tab);
});
function go(tab) {
  S.tab = tab; store.set('tab', tab); render(); window.scrollTo({ top: 0 });
  const b = $(`[data-tab="${tab}"]`); b && b.scrollIntoView({ inline: 'center', block: 'nearest' });
}
function destroyCharts() { Object.values(S.charts).forEach(c => c && c.destroy()); S.charts = {}; }
function render() {
  renderTabs(); destroyCharts();
  const v = $('#view');
  const fn = { ozet: viewSummary, hiz: viewSpeed, doktor: viewDoctor, cihazlar: viewDevices, wifi: viewWifi, modem: viewModem, gecmis: viewHistory, ayarlar: viewSettings }[S.tab] || viewSummary;
  v.innerHTML = fn();
  const after = { ozet: afterSummary, hiz: afterSpeed, doktor: qosUpdate, cihazlar: afterDevices, wifi: afterWifi, modem: afterModem, gecmis: afterHistory }[S.tab];
  after && after();
  renderAlert(); icons();
}
function needAgent(what) {
  return `<section class="card p-5">
    <div class="flex items-center gap-2 text-amber-300 font-semibold"><i data-lucide="plug"></i> ${esc(what)} için yerel ajan gerekli</div>
    <p class="text-sm text-slate-300 mt-2">Detaylı tarama için repodaki <code class="text-sky-300">baslat.bat</code> dosyasını çalıştırın.</p>
    ${agentHelp()}
    <button class="btn btn-primary mt-4" onclick="recheckAgent()"><i data-lucide="refresh-cw"></i> Ajanı tekrar ara</button>
  </section>`;
}
async function recheckAgent() { toast('Ajan aranıyor…'); S.agent = null; await detectAgent(); toast(S.agent ? 'Yerel ajan bağlandı' : 'Ajan bulunamadı'); }

/* ------------------------------------------------------------- puan & sorunlar */
function analyze(m) {
  const issues = []; let score = 100;
  const add = (pts, sev, key, title, detail) => { score -= pts; issues.push({ sev, key, title, detail }); };
  if (!m) return { score: null, issues };
  if (m.ping > 60) add(15, 'high', 'latency', 'İnternet gecikmesi yüksek', `Boşta ping ${fmt(m.ping, 0)} ms (iyi: < 30 ms).`);
  else if (m.ping > 30) add(6, 'mid', 'latency', 'İnternet gecikmesi orta', `Boşta ping ${fmt(m.ping, 0)} ms.`);
  if (m.jitter > 20) add(12, 'high', 'jitter', 'Jitter yüksek', `Gecikme dalgalanması ${fmt(m.jitter)} ms — görüntülü görüşme ve oyunlarda takılma yapar.`);
  else if (m.jitter > 8) add(5, 'mid', 'jitter', 'Jitter orta', `Gecikme dalgalanması ${fmt(m.jitter)} ms.`);
  const bb = m.bufferbloat;
  if (bb != null) {
    if (bb > 200) add(30, 'high', 'bufferbloat', 'Ciddi bufferbloat', `Yük altında gecikme +${fmt(bb, 0)} ms artıyor. QoS ile hız sınırı koyun.`);
    else if (bb > 60) add(18, 'high', 'bufferbloat', 'Bufferbloat var', `Yük altında gecikme +${fmt(bb, 0)} ms artıyor.`);
    else if (bb > 30) add(8, 'mid', 'bufferbloat', 'Hafif bufferbloat', `Yük altında gecikme +${fmt(bb, 0)} ms artıyor.`);
  }
  if (S.settings.planDown > 0 && m.download != null && m.download < S.settings.planDown * 0.6)
    add(15, 'high', 'slow', 'Hız aboneliğin altında', `${fmt(m.download, 0)} / ${S.settings.planDown} Mbps (%${fmt(100 * m.download / S.settings.planDown, 0)}).`);
  if (m.gwPing != null) {
    if (m.gwPing > 20) add(15, 'high', 'wifi', 'Modeme gecikme yüksek', `192.168.1.1 ping ${fmt(m.gwPing)} ms (kablosuzda iyi: < 5 ms). Wi-Fi sinyali/kanalı sorunlu.`);
    else if (m.gwPing > 6) add(6, 'mid', 'wifi', 'Modeme gecikme orta', `192.168.1.1 ping ${fmt(m.gwPing)} ms.`);
  }
  if (m.gwLoss > 2) add(25, 'high', 'loss', 'Paket kaybı', `Modeme %${fmt(m.gwLoss)} paket kaybı — parazit veya zayıf sinyal.`);
  else if (m.gwLoss > 0) add(8, 'mid', 'loss', 'Az paket kaybı', `Modeme %${fmt(m.gwLoss)} paket kaybı.`);
  if (m.dns && m.dns.length) {
    const cur = m.dns.find(d => d.current), best = m.dns.find(d => d.median != null);
    if (cur && best && cur.median != null && cur.median - best.median > 15)
      add(6, 'mid', 'dns', 'DNS daha hızlı olabilir', `Mevcut DNS ${fmt(cur.median, 0)} ms, ${best.name} ${fmt(best.median, 0)} ms.`);
  }
  if (m.wifiBand === '2.4') add(8, 'mid', 'band', '2.4 GHz bandındasınız', 'Cihaz 5 GHz yerine 2.4 GHz\'e bağlı; hız düşük ve parazit yüksek olur.');
  if (m.wifiSignal != null && m.wifiSignal < 50) add(10, 'high', 'signal', 'Wi-Fi sinyali zayıf', `Sinyal %${m.wifiSignal}. Modeme yaklaşın veya kanal/yerleşimi değiştirin.`);
  return { score: Math.max(0, Math.min(100, Math.round(score))), issues };
}
const scoreColor = s => s == null ? 'text-slate-400' : s >= 85 ? 'text-emerald-400' : s >= 65 ? 'text-amber-300' : 'text-rose-400';
const bbGrade = bb => bb == null ? '—' : bb < 5 ? 'A+' : bb < 30 ? 'A' : bb < 60 ? 'B' : bb < 200 ? 'C' : bb < 400 ? 'D' : 'F';

/* ------------------------------------------------------------- ÖZET */
function viewSummary() {
  const m = S.last, a = analyze(m);
  return `
  <section class="card p-5 grid sm:grid-cols-[auto,1fr] gap-5 items-center">
    <div class="relative w-36 h-36 mx-auto">
      <canvas id="score-ring" width="144" height="144"></canvas>
      <div class="absolute inset-0 flex flex-col items-center justify-center">
        <div class="text-4xl font-extrabold ${scoreColor(a.score)}">${a.score ?? '—'}</div>
        <div class="text-[11px] text-slate-400">Ağ Sağlık Puanı</div>
      </div>
    </div>
    <div>
      ${m ? `<p class="text-sm text-slate-400">Son ölçüm: ${new Date(m.ts).toLocaleString('tr-TR')} ${m.colo ? '· Cloudflare ' + esc(m.colo) : ''}</p>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-3">
        ${stat('İndirme', fmt(m.download), 'Mbps', 'download')}${stat('Yükleme', fmt(m.upload), 'Mbps', 'upload')}
        ${stat('Ping', fmt(m.ping, 0), 'ms', 'timer')}${stat('Bufferbloat', bbGrade(m.bufferbloat), m.bufferbloat != null ? '+' + fmt(m.bufferbloat, 0) + ' ms' : '', 'waves')}
      </div>` : `<p class="text-slate-300">Henüz ölçüm yok. Ağ sağlık puanı için bir hız testi yapın.</p>`}
      <div class="flex flex-wrap gap-2 mt-4">
        <button class="btn btn-primary" onclick="go('hiz')"><i data-lucide="play"></i> Hız testi</button>
        <button class="btn btn-ghost" onclick="go('doktor')"><i data-lucide="stethoscope"></i> Çözümler (${a.issues.length})</button>
      </div>
    </div>
  </section>
  <section class="grid sm:grid-cols-3 gap-3">
    ${quick('Cihazlar', S.agent ? (S.devices ? `${S.devices.devices.filter(d => d.online).length} çevrimiçi` : 'Taramak için dokunun') : 'Ajan gerekli', 'smartphone', 'cihazlar')}
    ${quick('Wi-Fi Kanal', S.agent ? (S.agent.info.wifi_supported ? 'Kanal analizi' : 'Windows gerekli') : 'Ajan gerekli', 'radio-tower', 'wifi')}
    ${quick('Modem', S.agent ? (S.agent.info.router_configured ? 'Bağlı — kontrol et' : 'Bağlantıyı ayarla') : 'Menü rehberi', 'router', 'modem')}
  </section>
  ${a.issues.length ? `<section class="card p-5"><h2 class="font-semibold mb-3">Tespit edilen sorunlar</h2><ul class="space-y-2">${a.issues.map(i =>
    `<li class="flex gap-2 text-sm"><span class="chip ${i.sev === 'high' ? 'bg-rose-500/20 text-rose-300' : 'bg-amber-500/20 text-amber-200'}">${i.sev === 'high' ? 'Önemli' : 'Orta'}</span><span><b>${esc(i.title)}</b> — <span class="text-slate-400">${esc(i.detail)}</span></span></li>`).join('')}</ul></section>` : ''}`;
}
const stat = (l, v, u, ic) => `<div class="rounded-xl bg-[#0b1220] border border-[#1e2a44] p-3"><div class="text-[11px] text-slate-400 flex items-center gap-1"><i data-lucide="${ic}"></i>${l}</div><div class="text-xl font-bold mt-0.5">${v}</div><div class="text-[11px] text-slate-500">${u}</div></div>`;

const rnd = () => Math.random().toString(36).slice(2);

}

  for (let i = 0; i < n; i++) { try { out.push(await latencyOnce()); } catch { } setLive('Gecikme ölçülüyor', 5 + i * 0.6, out.length ? `${fmt(median(out), 0)} ms` : ''); }

}

}

    const mbps = warmT ? ((bytes - warmBytes) * 8 / ((t - warmT) / 1000) / 1e6) : (bytes * 8 / (t / 1000) / 1e6);
    setLive('İndirme', base + span * Math.min(1, t / (sec * 1000)), `${fmt(mbps)} Mbps`);

async function runTest() {
  if (S.running) return;
  const note = ($('#test-note') || {}).value || '';

  const sec = Number(S.settings.duration) || 10;
  try {
    setLive('Gecikme ölçülüyor', 2, '');
    const idle = await idleLatency();
    if (!idle.length) throw new Error('Cloudflare ölçüm sunucusuna ulaşılamadı. İnternet bağlantısını kontrol edin.');
    const ping = median(idle), jitter = jitterOf(idle);

    const dl = [], stopD = { stop: false }; const pd = loadedProbe(stopD, dl);
    const download = await downloadTest(sec, 15, 35); stopD.stop = true; await pd;

    const ul = [], stopU = { stop: false }; const pu = loadedProbe(stopU, ul);
    const upload = await uploadTest(sec, 50, 35); stopU.stop = true; await pu;

    const loadedDown = median(dl), loadedUp = median(ul);
    const bufferbloat = Math.max(0, Math.max(loadedDown ?? ping, loadedUp ?? ping) - ping);
    const m = { ts: Date.now(), download, upload, ping, jitter, loadedDown, loadedUp, bufferbloat, colo: S._colo || '', note, mode: S.agent ? 'ajan' : 'tarayıcı' };

    if (S.agent) {
      setLive('Yerel ölçümler: EX20v ping, DNS, Wi-Fi', 88, '');
      const [gw, dns, wifi] = await Promise.allSettled([api('/api/ping?count=20'), api('/api/dns'), S.agent.info.wifi_supported ? api('/api/wifi?refresh=false') : Promise.reject()]);

      if (dns.status === 'fulfilled') m.dns = dns.value.results;
      if (wifi.status === 'fulfilled') { const i = wifi.value.interface || {}; Object.assign(m, { wifiBand: i.band, wifiChannel: i.channel, wifiSignal: i.signal }); S.wifi = wifi.value; }

}

  const H = S.history, local = store.get('history', []);
  const [a, b] = H; const diff = (k, better) => {
    if (!a || !b || a[k] == null || b[k] == null) return '—';
    const d = a[k] - b[k], good = better === 'up' ? d >= 0 : d <= 0;
    return `<span class="${good ? 'text-emerald-300' : 'text-rose-300'}">${d >= 0 ? '+' : ''}${fmt(d, k === 'download' || k === 'upload' ? 1 : 0)}</span>`;
  };
  return `
  <section class="card p-5">
    <div class="flex items-center justify-between gap-2 flex-wrap">
      <h2 class="font-semibold flex items-center gap-2"><i data-lucide="line-chart"></i> Ölçüm geçmişi</h2>
      <span class="chip bg-slate-700/60 text-slate-300">${S.agent ? 'SQLite (ajan)' : 'Bu tarayıcı (LocalStorage)'} · ${H.length} kayıt</span>
    </div>
    ${H.length ? `<div class="h-64 mt-4"><canvas id="hist"></canvas></div>` : '<p class="text-sm text-slate-400 mt-3">Henüz kayıt yok.</p>'}
  </section>
  ${a && b ? `<section class="card p-5"><h3 class="font-semibold mb-2">Son iki ölçüm: önce → sonra</h3>
    <p class="text-xs text-slate-400 mb-3">${esc(b.note || new Date(b.ts).toLocaleString('tr-TR'))} → ${esc(a.note || new Date(a.ts).toLocaleString('tr-TR'))}</p>
    <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 text-sm">
      ${[['İndirme', 'download', 'up', 'Mbps'], ['Yükleme', 'upload', 'up', 'Mbps'], ['Ping', 'ping', 'down', 'ms'], ['Bufferbloat', 'bufferbloat', 'down', 'ms'], ['Puan', 'score', 'up', '']]
        .map(([l, k, bt, u]) => `<div class="rounded-xl bg-[#0b1220] border border-[#1e2a44] p-3"><div class="text-xs text-slate-400">${l}</div><div class="font-bold">${diff(k, bt)} <span class="text-xs text-slate-500">${u}</span></div></div>`).join('')}
    </div></section>` : ''}
  <section class="card p-4 overflow-x-auto"><table class="w-full text-xs"><thead class="text-slate-400"><tr><th class="text-left py-1">Tarih</th><th>↓ Mbps</th><th>↑ Mbps</th><th>Ping</th><th>BB</th><th>Puan</th><th class="text-left">Not</th><th></th></tr></thead><tbody>
    ${H.slice(0, 100).map((m, idx) => `<tr class="border-t border-[#1e2a44]"><td class="py-1.5 pr-2 whitespace-nowrap">${new Date(m.ts).toLocaleString('tr-TR', { dateStyle: 'short', timeStyle: 'short' })}</td>
      <td class="text-center">${fmt(m.download)}</td><td class="text-center">${fmt(m.upload)}</td><td class="text-center">${fmt(m.ping, 0)}</td><td class="text-center">${bbGrade(m.bufferbloat)}</td>
      <td class="text-center ${scoreColor(m.score)}">${m.score ?? '—'}</td><td class="pr-2 max-w-[8rem] truncate">${esc(m.note || '')}</td>
      <td><button class="text-slate-500 hover:text-rose-300" title="Sil" onclick="delHistory(${idx})"><i data-lucide="trash-2"></i></button></td></tr>`).join('')}
  </tbody></table></section>
  <section class="flex flex-wrap gap-2">
    <button class="btn btn-ghost" onclick="exportHistory()"><i data-lucide="download"></i> JSON dışa aktar</button>
    ${S.agent && local.length ? `<button class="btn btn-ghost" onclick="importLocal()"><i data-lucide="upload"></i> Tarayıcıdaki ${local.length} kaydı ajana aktar</button>` : ''}
  </section>`;
}
function afterHistory() {
  if (!S.history.length || !$('#hist') || !window.Chart) return;
  const H = [...S.history].reverse(), lab = H.map(m => new Date(m.ts).toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }));
  S.charts.hist = new Chart($('#hist'), {
    type: 'line',
    data: { labels: lab, datasets: [
      { label: 'İndirme Mbps', data: H.map(m => m.download), borderColor: '#38bdf8', backgroundColor: '#38bdf8', tension: .3, yAxisID: 'y' },
      { label: 'Yükleme Mbps', data: H.map(m => m.upload), borderColor: '#a78bfa', backgroundColor: '#a78bfa', tension: .3, yAxisID: 'y' },
      { label: 'Ping ms', data: H.map(m => m.ping), borderColor: '#34d399', backgroundColor: '#34d399', tension: .3, yAxisID: 'y2' },
      { label: 'Bufferbloat ms', data: H.map(m => m.bufferbloat), borderColor: '#fb7185', backgroundColor: '#fb7185', borderDash: [4, 3], tension: .3, yAxisID: 'y2' }] },
    options: chartOpts({ y2: true }),
  });
}
async function delHistory(idx) {
  const m = S.history[idx]; if (!m || !confirm('Bu kayıt silinsin mi?')) return;
  if (S.agent && m.id != null) { try { await api(`/api/history/${m.id}`, { method: 'DELETE' }); } catch (e) { return toast(e.message); } }
  else store.set('history', store.get('history', []).filter(x => x.ts !== m.ts));
  await loadHistory(); render();
}
function exportHistory() {
  const blob = new Blob([JSON.stringify(S.history, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `ex20v-gecmis-${new Date().toISOString().slice(0, 10)}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function importLocal() {
  try { await api('/api/history', { method: 'POST', body: JSON.stringify(store.get('history', [])) }); store.set('history', []); await loadHistory(); render(); toast('Aktarıldı'); }
  catch (e) { toast('Aktarılamadı: ' + e.message); }
}

/* ------------------------------------------------------------- AYARLAR */
function viewSettings() {
  const s = S.settings;
  return `
  <section class="card p-5 space-y-3">
    <h2 class="font-semibold flex items-center gap-2"><i data-lucide="settings"></i> Ayarlar</h2>
    <label class="block text-sm text-slate-300">Abonelik hızı (Mbps) — puanlama için
      <div class="grid grid-cols-2 gap-2 mt-1"><input id="st-down" type="number" min="0" placeholder="İndirme" value="${s.planDown || ''}"><input id="st-up" type="number" min="0" placeholder="Yükleme" value="${s.planUp || ''}"></div></label>
    <label class="block text-sm text-slate-300">Test süresi (her yön)
      <select id="st-dur" class="mt-1">${[6, 10, 15].map(v => `<option value="${v}" ${Number(s.duration) === v ? 'selected' : ''}>${v} saniye${v === 6 ? ' (az veri)' : v === 10 ? ' (önerilen)' : ' (daha kararlı)'}</option>`).join('')}</select></label>
    <label class="block text-sm text-slate-300">Yerel ajan adresi (isteğe bağlı)
      <input id="st-url" class="mt-1" placeholder="http://localhost:${AGENT_PORT}" value="${esc(s.agentUrl)}"></label>
    <label class="block text-sm text-slate-300">Ajan anahtarı (telefondan modem işlemleri için)
      <input id="st-key" class="mt-1" inputmode="numeric" maxlength="12" placeholder="baslat.bat penceresindeki 6 haneli sayı" value="${esc(s.key)}"></label>
    <div class="flex gap-2 flex-wrap"><button class="btn btn-primary" onclick="saveSettingsForm()"><i data-lucide="save"></i> Kaydet</button>
      <button class="btn btn-ghost" onclick="recheckAgent()"><i data-lucide="refresh-cw"></i> Ajanı tekrar ara</button></div>
  </section>
  <section class="card p-5 text-sm text-slate-300 space-y-2">
    <h3 class="font-semibold">Mod durumu</h3>
    ${S.agent ? `<p>Yerel ajan: <b>${esc(S.agent.base)}</b> · v${esc(S.agent.info.version)} · ${esc(S.agent.info.platform)}</p>` : `<p>Ajan bulunamadı — Bulut/Tarayıcı Modu.</p>${agentHelp()}`}
  </section>
  <section class="card p-5 text-sm text-slate-300 space-y-2">
    <h3 class="font-semibold">Veri</h3>
    <button class="btn btn-danger" onclick="if(confirm('Bu tarayıcıdaki tüm kayıt ve ayarlar silinsin mi?')){Object.keys(localStorage).filter(k=>k.startsWith('ex20v.')).forEach(k=>localStorage.removeItem(k));location.reload()}"><i data-lucide="trash-2"></i> Tarayıcı verilerini sil</button>
    <p class="text-xs text-slate-500">EX20v Ağ Kontrol Merkezi v${VERSION} · Açık kaynak · Veriler yalnızca bu cihazda / yerel ajanda tutulur.</p>
  </section>`;
}
function saveSettingsForm() {
  Object.assign(S.settings, { planDown: Number($('#st-down').value) || 0, planUp: Number($('#st-up').value) || 0, duration: Number($('#st-dur').value) || 10, agentUrl: $('#st-url').value.trim(), key: $('#st-key').value.trim() });
  saveSettings(); toast('Kaydedildi');
}

/* ------------------------------------------------------------- başlat */
$('#app-version').textContent = 'v' + VERSION;
document.title = `EX20v Ağ Kontrol Merkezi v${VERSION}`;
renderBadge(); render();
loadHistory().then(() => S.tab === 'gecmis' && render());
detectAgent();
if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
</body>
</html>
